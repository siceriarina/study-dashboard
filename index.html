<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Study Dashboard</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      background:#0f172a;

      color:white;

      padding:20px;
    }

    .container{

      width:100%;
      max-width:700px;

    }

    h1{

      text-align:center;

      margin-bottom:20px;

      font-size:40px;

    }

    .card{

      background:#1e293b;

      padding:25px;

      border-radius:20px;

      margin-bottom:20px;

      box-shadow:
      0 0 20px rgba(0,255,255,0.2);

    }

    h2{

      text-align:center;

      margin-bottom:20px;

    }

    /* CLOCK */

    #clock{

      text-align:center;

      font-size:65px;

      font-weight:bold;

      letter-spacing:2px;

    }

    /* POMODORO */

    #timer{

      text-align:center;

      font-size:70px;

      font-weight:bold;

      margin-bottom:20px;

    }

    .buttons{

      display:flex;

      justify-content:center;

      gap:10px;

      flex-wrap:wrap;

    }

    button{

      border:none;

      padding:12px 20px;

      border-radius:12px;

      cursor:pointer;

      font-size:16px;

      font-weight:bold;

      transition:0.3s;

    }

    button:hover{

      transform:scale(1.05);

    }

    .start-btn{

      background:#22c55e;

      color:white;

    }

    .stop-btn{

      background:#ef4444;

      color:white;

    }

    .reset-btn{

      background:#3b82f6;

      color:white;

    }

    /* PROGRESS BAR */

    .progress-container{

      width:100%;

      height:15px;

      background:#334155;

      border-radius:20px;

      overflow:hidden;

      margin-bottom:20px;

    }

    .progress-bar{

      height:100%;

      width:100%;

      background:linear-gradient(
      to right,
      cyan,
      #22c55e
      );

      transition:1s linear;

    }

    /* TODO */

    .todo-input{

      display:flex;

      gap:10px;

      margin-bottom:20px;

    }

    input{

      flex:1;

      padding:12px;

      border:none;

      border-radius:12px;

      font-size:16px;

      outline:none;

    }

    .add-btn{

      background:cyan;

      color:black;

    }

    ul{

      list-style:none;

    }

    li{

      background:#334155;

      margin-bottom:10px;

      padding:12px 15px;

      border-radius:12px;

      display:flex;

      justify-content:space-between;

      align-items:center;

      gap:10px;

      animation:fadeIn 0.3s ease;

    }

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(10px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    .task-text{

      flex:1;

      word-break:break-word;

    }

    .done{

      text-decoration:line-through;

      opacity:0.5;

    }

    .task-buttons{

      display:flex;

      gap:5px;

    }

    .done-btn{

      background:#22c55e;

      color:white;

    }

    .delete-btn{

      background:#ef4444;

      color:white;

    }

    .stats{

      margin-top:15px;

      text-align:center;

      opacity:0.8;

    }

    /* MOBILE */

    @media(max-width:600px){

      #clock{
        font-size:40px;
      }

      #timer{
        font-size:50px;
      }

      .todo-input{
        flex-direction:column;
      }

      h1{
        font-size:30px;
      }

    }

  </style>
</head>
<body>

  <div class="container">

    <h1>📚 Study Dashboard</h1>

    <!-- CLOCK -->

    <div class="card">

      <h2>⏰ Digital Clock</h2>

      <div id="clock">
        00:00:00
      </div>

    </div>

    <!-- POMODORO -->

    <div class="card">

      <h2>🍅 Pomodoro Timer</h2>

      <div id="timer">
        25:00
      </div>

      <div class="progress-container">

        <div class="progress-bar"
        id="progressBar"></div>

      </div>

      <div class="buttons">

        <button
        class="start-btn"
        onclick="startTimer()">

          Start

        </button>

        <button
        class="stop-btn"
        onclick="stopTimer()">

          Stop

        </button>

        <button
        class="reset-btn"
        onclick="resetTimer()">

          Reset

        </button>

      </div>

    </div>

    <!-- TODO -->

    <div class="card">

      <h2>📝 To-Do List</h2>

      <div class="todo-input">

        <input
        type="text"
        id="taskInput"
        placeholder="Tambah tugas..."
        >

        <button
        class="add-btn"
        onclick="addTask()">

          Tambah

        </button>

      </div>

      <ul id="taskList"></ul>

      <div class="stats">

        Total Task:
        <span id="taskCount">0</span>

      </div>

    </div>

  </div>

  <script>

    // =========================
    // DIGITAL CLOCK
    // =========================

    function updateClock(){

      const now = new Date();

      let hours =
      String(now.getHours())
      .padStart(2,'0');

      let minutes =
      String(now.getMinutes())
      .padStart(2,'0');

      let seconds =
      String(now.getSeconds())
      .padStart(2,'0');

      document.getElementById("clock")
      .innerText =
      `${hours}:${minutes}:${seconds}`;

    }

    setInterval(updateClock,1000);

    updateClock();


    // =========================
    // POMODORO TIMER
    // =========================

    let totalTime = 25 * 60;

    let time = totalTime;

    let timer;

    function updateTimer(){

      let minutes =
      Math.floor(time / 60);

      let seconds =
      time % 60;

      minutes =
      String(minutes)
      .padStart(2,'0');

      seconds =
      String(seconds)
      .padStart(2,'0');

      document.getElementById("timer")
      .innerText =
      `${minutes}:${seconds}`;

      // progress bar

      const progress =
      (time / totalTime) * 100;

      document.getElementById("progressBar")
      .style.width =
      progress + "%";

    }

    function startTimer(){

      clearInterval(timer);

      timer = setInterval(() => {

        if(time > 0){

          time--;

          updateTimer();

        }else{

          clearInterval(timer);

          alert("🍅 Pomodoro selesai!");

        }

      },1000);

    }

    function stopTimer(){

      clearInterval(timer);

    }

    function resetTimer(){

      clearInterval(timer);

      time = totalTime;

      updateTimer();

    }

    updateTimer();


    // =========================
    // TODO LIST
    // =========================

    function addTask(){

      const input =
      document.getElementById("taskInput");

      const text =
      input.value.trim();

      if(text === "") return;

      createTask(text,false);

      saveTasks();

      updateTaskCount();

      input.value = "";

    }

    function createTask(text,done){

      const li =
      document.createElement("li");

      li.innerHTML = `

        <span class="task-text">
          ${text}
        </span>

        <div class="task-buttons">

          <button class="done-btn">
            ✓
          </button>

          <button class="delete-btn">
            ✕
          </button>

        </div>

      `;

      const taskText =
      li.querySelector(".task-text");

      if(done){

        taskText.classList.add("done");

      }

      // tombol selesai

      li.querySelector(".done-btn")
      .addEventListener("click", () => {

        taskText.classList.toggle("done");

        saveTasks();

      });

      // tombol hapus

      li.querySelector(".delete-btn")
      .addEventListener("click", () => {

        li.remove();

        saveTasks();

        updateTaskCount();

      });

      document.getElementById("taskList")
      .appendChild(li);

    }

    // ENTER KEY

    document.getElementById("taskInput")
    .addEventListener("keypress", function(e){

      if(e.key === "Enter"){

        addTask();

      }

    });

    // SAVE TASKS

    function saveTasks(){

      const tasks = [];

      document.querySelectorAll("#taskList li")
      .forEach(li => {

        tasks.push({

          text:
          li.querySelector(".task-text")
          .innerText,

          done:
          li.querySelector(".task-text")
          .classList.contains("done")

        });

      });

      localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
      );

    }

    // LOAD TASKS

    function loadTasks(){

      const savedTasks =
      JSON.parse(
        localStorage.getItem("tasks")
      ) || [];

      savedTasks.forEach(task => {

        createTask(
          task.text,
          task.done
        );

      });

      updateTaskCount();

    }

    // TASK COUNT

    function updateTaskCount(){

      const total =
      document.querySelectorAll("#taskList li")
      .length;

      document.getElementById("taskCount")
      .innerText = total;

    }

    loadTasks();

  </script>

</body>
</html>
