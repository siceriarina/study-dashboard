<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Dashboard</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0f172a;
  color:white;
  padding:20px;
  transition:0.3s;
}

.light{
  background:#f1f5f9;
  color:black;
}

.container{
  width:100%;
  max-width:700px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  margin-bottom:15px;
  border-radius:15px;
  box-shadow:0 0 15px rgba(0,255,255,0.2);
}

.light .card{
  background:white;
}

.center{
  text-align:center;
}

/* CLOCK */
#clock{
  font-size:55px;
  font-weight:bold;
}

/* TIMER */
#timer{
  font-size:60px;
  font-weight:bold;
  margin-bottom:10px;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
  font-weight:bold;
}

.start{background:#22c55e;color:white;}
.stop{background:#ef4444;color:white;}
.reset{background:#3b82f6;color:white;}

/* TODO */
.todo{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
}

ul{
  list-style:none;
  margin-top:10px;
}

li{
  background:#334155;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
}

.done{
  text-decoration:line-through;
  opacity:0.5;
}

/* top buttons */
.top-btn{
  position:fixed;
  top:15px;
  right:15px;
}
</style>
</head>

<body>

<button class="top-btn" onclick="toggleTheme()">🌙</button>

<div class="container">

<h1>📚 Study Dashboard</h1>

<!-- CLOCK -->
<div class="card center">
  <h2>⏰ Clock</h2>
  <div id="clock">00:00:00</div>
  <div id="date"></div>
</div>

<!-- POMODORO -->
<div class="card center">
  <h2>🍅 Pomodoro</h2>
  <div id="timer">25:00</div>

  <button class="start" onclick="start()">Start</button>
  <button class="stop" onclick="stop()">Stop</button>
  <button class="reset" onclick="reset()">Reset</button>
</div>

<!-- TODO -->
<div class="card">
  <h2 class="center">📝 To-Do</h2>

  <div class="todo">
    <input id="taskInput" placeholder="Tulis tugas...">
    <button onclick="addTask()">Add</button>
  </div>

  <ul id="list"></ul>

  <p class="center">🔥 Streak: <span id="streak">0</span> hari</p>
</div>

</div>

<audio id="alarm">
<source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg">
</audio>

<script>

/* ================= CLOCK ================= */
function clock(){
  const now = new Date();

  document.getElementById("clock").innerText =
  now.toLocaleTimeString();

  document.getElementById("date").innerText =
  now.toLocaleDateString("id-ID", {
    weekday:"long",
    year:"numeric",
    month:"long",
    day:"numeric"
  });
}
setInterval(clock,1000);
clock();

/* ================= POMODORO ================= */
let total = 25*60;
let time = total;
let timer;
let breakMode = false;

function updateTimer(){
  let m = String(Math.floor(time/60)).padStart(2,'0');
  let s = String(time%60).padStart(2,'0');
  document.getElementById("timer").innerText = `${m}:${s}`;
}

function start(){
  clearInterval(timer);

  timer = setInterval(()=>{
    if(time>0){
      time--;
      updateTimer();
    } else {
      document.getElementById("alarm").play();

      if(!breakMode){
        alert("Fokus selesai! Break 5 menit ☕");
        time = 5*60;
        breakMode = true;
      } else {
        alert("Break selesai! Fokus lagi 🍅");
        time = total;
        breakMode = false;
      }
      updateTimer();
    }
  },1000);
}

function stop(){
  clearInterval(timer);
}

function reset(){
  clearInterval(timer);
  time = total;
  breakMode = false;
  updateTimer();
}
updateTimer();

/* ================= TODO ================= */
function addTask(){
  const input = document.getElementById("taskInput");
  let text = input.value.trim();
  if(text==="") return;

  const li = document.createElement("li");

  li.innerHTML = `
  <span>${text}</span>
  <div>
    <button onclick="doneTask(this)">✔</button>
    <button onclick="deleteTask(this)">✖</button>
  </div>`;

  document.getElementById("list").appendChild(li);

  input.value="";
  save();
}

function doneTask(btn){
  btn.parentElement.parentElement
  .querySelector("span")
  .classList.toggle("done");

  save();
}

function deleteTask(btn){
  btn.parentElement.parentElement.remove();
  save();
}

function save(){
  let data = [];
  document.querySelectorAll("#list li").forEach(li=>{
    data.push({
      text: li.querySelector("span").innerText,
      done: li.querySelector("span").classList.contains("done")
    });
  });

  localStorage.setItem("tasks", JSON.stringify(data));
}

/* load */
function load(){
  let data = JSON.parse(localStorage.getItem("tasks")) || [];

  data.forEach(t=>{
    const li = document.createElement("li");

    li.innerHTML = `
    <span class="${t.done?'done':''}">${t.text}</span>
    <div>
      <button onclick="doneTask(this)">✔</button>
      <button onclick="deleteTask(this)">✖</button>
    </div>`;

    document.getElementById("list").appendChild(li);
  });
}
load();

/* ================= STREAK ================= */
function streak(){
  let last = localStorage.getItem("last");
  let today = new Date().toDateString();

  let s = parseInt(localStorage.getItem("streak")) || 0;

  if(last !== today){
    s++;
    localStorage.setItem("streak", s);
    localStorage.setItem("last", today);
  }

  document.getElementById("streak").innerText = s;
}
streak();

/* ================= THEME ================= */
function toggleTheme(){
  document.body.classList.toggle("light");
}

</script>

</body>
</html>
