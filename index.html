<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Dashboard</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      background:#0f172a;
      color:white;

      padding:20px;
    }

    .container{
      width:100%;
      max-width:700px;
    }

    .card{
      background:#1e293b;

      padding:25px;
      margin-bottom:20px;

      border-radius:20px;

      box-shadow:
      0 0 20px rgba(0,255,255,0.2);
    }

    h1{
      text-align:center;
      margin-bottom:20px;
    }

    h2{
      margin-bottom:15px;
      text-align:center;
    }

    /* CLOCK */

    #clock{
      font-size:60px;
      font-weight:bold;
      text-align:center;
    }

    /* TIMER */

    #timer{
      font-size:70px;
      text-align:center;
      margin-bottom:20px;
      font-weight:bold;
    }

    .buttons{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    button{

      padding:12px 20px;

      border:none;
      border-radius:10px;

      cursor:pointer;

      background:cyan;
      color:black;

      font-size:16px;
      font-weight:bold;

      transition:0.3s;
    }

    button:hover{
      transform:scale(1.05);
    }

    /* TODO */

    .todo-input{
      display:flex;
      gap:10px;
      margin-bottom:20px;
    }

    input{

      flex:1;

      padding:12px;

      border:none;
      border-radius:10px;

      font-size:16px;
    }

    ul{
      list-style:none;
    }

    li{

      background:#334155;

      padding:12px 15px;

      border-radius:10px;

      margin-bottom:10px;

      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .delete-btn{
      background:tomato;
      color:white;
    }

    .done{
      text-decoration:line-through;
      opacity:0.6;
    }

    @media(max-width:600px){

      #clock{
        font-size:40px;
      }

      #timer{
        font-size:50px;
      }

      .todo-input{
        flex-direction:column;
      }

    }

  </style>
</head>
<body>

  <div class="container">

    <h1>Study Dashboard</h1>

    <!-- CLOCK -->
    <div class="card">

      <h2>⏰ Digital Clock</h2>

      <div id="clock">
        00:00:00
      </div>

    </div>

    <!-- POMODORO -->
    <div class="card">

      <h2>🍅 Pomodoro Timer</h2>

      <div id="timer">
        25:00
      </div>

      <div class="buttons">

        <button onclick="startTimer()">
          Start
        </button>

        <button onclick="stopTimer()">
          Stop
        </button>

        <button onclick="resetTimer()">
          Reset
        </button>

      </div>

    </div>

    <!-- TODO -->
    <div class="card">

      <h2>📝 To-Do List</h2>

      <div class="todo-input">

        <input
          type="text"
          id="taskInput"
          placeholder="Tambah tugas..."
        >

        <button onclick="addTask()">
          Tambah
        </button>

      </div>

      <ul id="taskList"></ul>

    </div>

  </div>

  <script>

    // =========================
    // DIGITAL CLOCK
    // =========================

    function updateClock(){

      const now = new Date();

      let hours = now.getHours();
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();

      hours = String(hours).padStart(2,'0');
      minutes = String(minutes).padStart(2,'0');
      seconds = String(seconds).padStart(2,'0');

      document.getElementById("clock").innerText =
      `${hours}:${minutes}:${seconds}`;

    }

    setInterval(updateClock,1000);

    updateClock();


    // =========================
    // POMODORO TIMER
    // =========================

    let time = 25 * 60;

    let timer;

    function updateTimer(){

      let minutes =
      Math.floor(time / 60);

      let seconds =
      time % 60;

      minutes = String(minutes)
      .padStart(2,'0');

      seconds = String(seconds)
      .padStart(2,'0');

      document.getElementById("timer")
      .innerText =
      `${minutes}:${seconds}`;

    }

    function startTimer(){

      clearInterval(timer);

      timer = setInterval(() => {

        if(time > 0){

          time--;

          updateTimer();

        }else{

          clearInterval(timer);

          alert("Pomodoro selesai!");

        }

      },1000);

    }

    function stopTimer(){

      clearInterval(timer);

    }

    function resetTimer(){

      clearInterval(timer);

      time = 25 * 60;

      updateTimer();

    }

    updateTimer();


    // =========================
    // TODO LIST
    // =========================

    function addTask(){

      const input =
      document.getElementById("taskInput");

      const text = input.value.trim();

      if(text === "") return;

      const li =
      document.createElement("li");

      li.innerHTML = `

        <span>${text}</span>

        <div>

          <button class="done-btn">
            ✓
          </button>

          <button class="delete-btn">
            Hapus
          </button>

        </div>

      `;

      // tombol selesai
      li.querySelector(".done-btn")
      .addEventListener("click", () => {

        li.querySelector("span")
        .classList.toggle("done");

      });

      // tombol hapus
      li.querySelector(".delete-btn")
      .addEventListener("click", () => {

        li.remove();

      });

      document.getElementById("taskList")
      .appendChild(li);

      input.value = "";

    }

    // ENTER untuk tambah task

    document.getElementById("taskInput")
    .addEventListener("keypress", function(e){

      if(e.key === "Enter"){

        addTask();

      }

    });

  </script>

</body>
</html>
